[project]
name = "ha-usage-score"
version = "0.1.0"
description = "HAUS - Home Assistant Usage Score"
requires-python = ">=3.14"

[tool.uv]
package = false

[dependency-groups]
dev = [
    "homeassistant",
    "pytest",
    "pytest-homeassistant-custom-component",
    "pytest-cov",
    "ruff",
    "mypy",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "ANN", "D"]
ignore = ["D203", "D213"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D", "ANN"]

[tool.mypy]
python_version = "3.14"
strict = true
files = ["custom_components/haus"]
mypy_path = "."
explicit_package_bases = true
namespace_packages = true

[tool.coverage.run]
source = ["custom_components/haus"]

[tool.coverage.report]
# The whole component, not a chosen two. The gate used to cover only scoring.py
# and collectors.py, which meant config_flow.py was never measured at all - and
# the quality scale asks for it specifically, at 100%. A gate you cannot see
# through is not a gate.
#
# 95 rather than 100 on purpose: the scale's own threshold, and a gate at 100
# turns every unreachable defensive line into a build failure, which is how
# `# pragma: no cover` starts spreading.
fail_under = 95
show_missing = true
